<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal System - ขั้นตอนที่ 5: สรุปความเสี่ยงของสัญญา</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">@theme { --font-sans: 'Kanit', sans-serif; }</style>
    <link rel="stylesheet" href="shared-styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>
<div class="ml-[260px] mt-14 p-7 min-h-[calc(100vh-56px)] max-md:ml-0 max-md:p-4 max-[480px]:mt-[50px] max-[480px]:p-3">
    <div class="flex justify-between items-start mb-6 max-md:flex-col max-md:gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2.5 max-md:text-xl">
                <i data-lucide="triangle-alert" class="w-6 h-6" style="color:#BE123C;"></i>
                สรุปความเสี่ยงของสัญญา
            </h1>
            <p class="text-slate-500 text-sm mt-1">ขั้นตอนที่ 5: ผู้จัดการฝ่ายกฎหมายสรุปความเสี่ยงของสัญญา</p>
        </div>
    </div>
    <div id="stepper-container"></div>
    <div id="status-header"></div>
    <div id="previous-steps"></div>

    <!-- ═══ ACTIVE: สรุปความเสี่ยง ═══ -->
    <div class="bg-white rounded-xl p-6 mb-5 shadow-sm border-2 border-blue-600 shadow-md max-md:p-4">
        <div class="text-base font-bold text-[#1B3A6B] mb-4 pb-3 border-b-2 border-blue-50 flex items-center gap-2.5 flex-wrap">
            <span class="bg-blue-600 text-white text-[11px] px-2.5 py-0.5 rounded-full font-semibold">5</span>
            <i data-lucide="triangle-alert" class="w-5 h-5" style="color:#2563EB;"></i>
            สรุปความเสี่ยงของสัญญา
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-semibold bg-pink-100 text-pink-700 ml-auto">
                <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                ผู้จัดการฝ่ายกฎหมาย
            </span>
        </div>
        <div class="grid grid-cols-2 gap-x-6 gap-y-4 max-md:grid-cols-1">
            <div class="flex flex-col gap-1.5">
                <label class="text-[13px] font-semibold text-slate-600">มีความเสี่ยง</label>
                <div class="flex items-center gap-3">
                    <label class="toggle">
                        <input type="checkbox" id="hasRisk" onchange="document.getElementById('remarkField').classList.toggle('is-hidden',!this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="text-[13px] text-slate-600">เปิดเพื่อระบุรายละเอียดความเสี่ยง</span>
                </div>
            </div>
            <div class="flex flex-col gap-1.5 is-hidden" id="remarkField">
                <label class="text-[13px] font-semibold text-slate-600">Remark</label>
                <textarea class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-800 bg-white outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition-colors resize-y min-h-[72px]" placeholder="ระบุรายละเอียดความเสี่ยงที่พบ"></textarea>
            </div>
            <div class="flex flex-col gap-1.5 col-span-full">
                <label class="text-[13px] font-semibold text-slate-600">ความเห็น / ข้อเสนอแนะ</label>
                <textarea class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-800 bg-white outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition-colors resize-y min-h-[72px]" placeholder="ความเห็นเกี่ยวกับความเสี่ยงของสัญญาฉบับนี้"></textarea>
            </div>
        </div>

        <div class="flex justify-between items-center gap-3 pt-5 mt-5 border-t border-slate-200 flex-wrap max-md:justify-center">
            <a href="contract-repository.html" class="inline-flex items-center gap-2 px-5 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors no-underline">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> ย้อนกลับ
            </a>
            <div class="flex items-center gap-3">
                <button class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-[#FF8888] text-white hover:bg-[#E07777] transition-colors cursor-pointer border-none">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                    ส่งกลับแก้ไข
                </button>
                <a href="step6-sign-type.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-[#6BDE9D] text-white hover:bg-[#5AC88B] transition-colors no-underline">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    อนุมัติ
                </a>
            </div>
        </div>
    </div>

</div>
<script src="shared-layout.js"></script>
<script>
    initPage(5);
</script>
</body>
</html>
