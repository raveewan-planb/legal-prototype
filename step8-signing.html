<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal System - ขั้นตอนที่ 8: แนบไฟล์สัญญาฉบับสมบูรณ์เข้าระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">@theme { --font-sans: 'Kanit', sans-serif; }</style>
    <link rel="stylesheet" href="shared-styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>
<div class="ml-[260px] mt-14 p-7 min-h-[calc(100vh-56px)] max-md:ml-0 max-md:p-4 max-[480px]:mt-[50px] max-[480px]:p-3">
    <div class="flex justify-between items-start mb-6 max-md:flex-col max-md:gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2.5 max-md:text-xl"><i data-lucide="file-up" class="w-6 h-6" style="color:#C2410C;"></i> แนบไฟล์สัญญาฉบับสมบูรณ์เข้าระบบ</h1>
            <p class="text-slate-500 text-sm mt-1">ขั้นตอนที่ 8: ผู้ใช้งานแนบไฟล์สัญญาฉบับสมบูรณ์เข้าระบบ เพื่อให้ฝ่ายกฎหมายตรวจสอบ</p>
        </div>
    </div>
    <div id="stepper-container"></div>
    <div id="status-header"></div>
    <div id="previous-steps"></div>

    <!-- ═══ ACTIVE: แนบสัญญาฉบับสมบูรณ์ ═══ -->
    <div class="bg-white rounded-xl p-6 mb-5 shadow-sm border-2 border-blue-600 shadow-md max-md:p-4">
        <div class="text-base font-bold text-[#1B3A6B] mb-4 pb-3 border-b-2 border-blue-50 flex items-center gap-2.5 flex-wrap">
            <span class="bg-blue-600 text-white text-[11px] px-2.5 py-0.5 rounded-full font-semibold">8</span>
            <i data-lucide="file-up" class="w-5 h-5" style="color:#2563EB;"></i> แนบไฟล์สัญญาฉบับสมบูรณ์เข้าระบบ
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 ml-auto"><i data-lucide="user" class="w-3 h-3"></i> ผู้ใช้งานทั่วไป</span>
        </div>
        <div class="grid grid-cols-2 gap-x-6 gap-y-4 max-md:grid-cols-1">
            <div class="flex flex-col gap-1.5 col-span-full">
                <label class="text-[13px] font-semibold text-slate-600">สัญญาฉบับสมบูรณ์ <span class="text-red-500">*</span></label>
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-5 text-center cursor-pointer hover:border-blue-600 hover:bg-blue-50 transition-all bg-slate-50/50" onclick="this.querySelector('input').click()">
                    <input type="file" hidden multiple accept=".pdf">
                    <i data-lucide="cloud-upload" class="w-8 h-8 mx-auto text-slate-400"></i>
                    <p class="mt-2 text-[13px] text-slate-600">ลากไฟล์มาวาง หรือ <span class="text-blue-600 font-semibold">เลือกไฟล์</span></p>
                    <p class="text-[11px] text-slate-400 mt-1">PDF (สูงสุด 25MB)</p>
                </div>
            </div>
            <div class="flex flex-col gap-1.5 col-span-full">
                <label class="text-[13px] font-semibold text-slate-600">ความเห็น / ข้อเสนอแนะ</label>
                <textarea placeholder="ความเห็นเพิ่มเติม (ถ้ามี)" class="px-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-800 bg-white outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition-colors resize-y min-h-[72px]"></textarea>
            </div>
        </div>

        <div class="flex justify-between items-center gap-3 pt-5 mt-5 border-t border-slate-200 flex-wrap max-md:justify-center">
            <a href="contract-repository.html" class="inline-flex items-center gap-2 px-5 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors no-underline">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> ย้อนกลับ
            </a>
            <a href="step9-final-review.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-[#88D2F2] text-[#1B3A6B] hover:bg-[#6BBFE0] transition-colors no-underline"><i data-lucide="send" class="w-4 h-4"></i> ส่งให้ฝ่ายกฎหมายตรวจสอบ</a>
        </div>
    </div>

</div>
<script src="shared-layout.js"></script>
<script>
    initPage(8);
    lucide.createIcons();
</script>
</body>
</html>
